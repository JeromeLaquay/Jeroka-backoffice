# Prometheus — stack locale (docker-compose).
# Cibles : métriques Spring Boot (/actuator/prometheus) + kafka-exporter.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: spring-boot
    metrics_path: /actuator/prometheus
    scrape_interval: 15s
    static_configs:
      - targets:
          - gateway:3000
          - email-service:3003
          - auth-service:3004
          - organization-service:3005
          - crm-service:3006
          - catalog-service:3007
          - billing-service:3008
          - scheduling-service:3009
          - content-service:3010
          - docs-service:3011
          - audit-service:3012
          - dashboard-bff:3013
          - email-events-worker:3015
          - ia-docs-events-worker:3016

  - job_name: kafka
    scrape_interval: 15s
    static_configs:
      - targets:
          - kafka-exporter:9308
